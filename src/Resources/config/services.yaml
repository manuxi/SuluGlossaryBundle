services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    Manuxi\SuluGlossaryBundle\Admin\GlossaryEntryAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_content.content_view_builder_factory'
            - '@sulu_security.security_checker'
            - '@sulu.core.localization_manager'
            - '@sulu_activity.activity_list_view_builder_factory'
            - '@sulu_reference.reference_list_view_builder_factory'
            - '@?sulu_automation.automation_view_builder_factory'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }

    Manuxi\SuluGlossaryBundle\Admin\SettingsAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_security.security_checker'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }

    Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepository:
        public: true
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.dimension_content_query_enhancer'

    Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface:
        alias: Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepository

    Manuxi\SuluGlossaryBundle\Application\GlossaryEntryTranslationRemover:
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_activity.domain_event_collector'
            - '@sulu_trash.trash_manager'

    Manuxi\SuluGlossaryBundle\Content\DataMapper\GlossaryEntryTypeDataMapper:
        tags:
            - { name: sulu_content.data_mapper }

    Manuxi\SuluGlossaryBundle\Content\Merger\GlossaryEntryTypeMerger:
        tags:
            - { name: sulu_content.merger }

    Manuxi\SuluGlossaryBundle\Trash\GlossaryEntryTrashItemHandler:
        arguments:
            - '@sulu_trash.trash_item_repository'
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_content.content_normalizer'
            - '@sulu_content.content_merger'
            - '@sulu_content.content_manager'
            - '@sulu_activity.domain_event_collector'
        tags:
            - { name: sulu_trash.store_trash_item_handler }
            - { name: sulu_trash.restore_trash_item_handler }
            - { name: sulu_trash.restore_configuration_provider }

    Manuxi\SuluGlossaryBundle\Routing\GlossaryEntryRouteDefaultsProvider:
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_content.content_aggregator'
            - '@sulu_admin.metadata_provider_registry'
            - '@sulu_http_cache.cache_lifetime.resolver'
        tags:
            - { name: sulu_route.route_defaults_provider, resource_key: glossary_entries }

    sulu_glossary.preview_object_provider:
        class: Sulu\Content\Infrastructure\Sulu\Preview\ContentObjectProvider
        arguments:
            - '@sulu_admin.metadata_provider_registry'
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_aggregator'
            - '@sulu_content.content_data_mapper'
            - Manuxi\SuluGlossaryBundle\Entity\GlossaryEntry
            - sulu.glossary.entries
            - '@sulu_content.content_normalizer'
        tags:
            - { name: sulu.context, context: admin }
            - { name: sulu_preview.object_provider, provider-key: glossary_entries }

    Manuxi\SuluGlossaryBundle\Content\ResourceLoader\GlossaryEntryResourceLoader:
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
        tags:
            - { name: sulu_content.resource_loader }

    Manuxi\SuluGlossaryBundle\Content\PropertyResolver\GlossaryEntrySelectionPropertyResolver:
        tags:
            - { name: sulu_content.property_resolver }

    Manuxi\SuluGlossaryBundle\Content\PropertyResolver\SingleGlossaryEntrySelectionPropertyResolver:
        tags:
            - { name: sulu_content.property_resolver }

    Manuxi\SuluGlossaryBundle\Content\GlossaryEntrySmartContentProvider:
        arguments:
            - '@sulu_content.dimension_content_query_enhancer'
            - '@sulu_admin.smart_content_query_enhancer'
            - '@doctrine.orm.entity_manager'
            - '@translator'
        tags:
            - { name: sulu_content.smart_content_provider, type: glossary_entries }

    Manuxi\SuluGlossaryBundle\Teaser\GlossaryEntryTeaserProvider:
        public: true
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_content.content_aggregator'
            - '@sulu_content.content_enhancer'
            - '@sulu_route.route_generator'
            - '@translator'
        tags:
            - { name: sulu.teaser.provider, alias: glossary_entries }

    Manuxi\SuluGlossaryBundle\Link\GlossaryEntryLinkProvider:
        public: true
        arguments:
            - '@sulu_content.content_manager'
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_http_cache.reference_store'
            - '@translator'
        tags:
            - { name: sulu.link.provider, alias: glossary_entries }

    Manuxi\SuluGlossaryBundle\Sitemap\GlossaryEntrySitemapProvider:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_core.webspace.webspace_manager'
            - '%kernel.environment%'
        tags:
            - { name: sulu.sitemap.provider }

    Manuxi\SuluGlossaryBundle\Search\GlossaryEntryAdminReindexProvider:
        arguments:
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: cmsig_seal.reindex_provider }

    Manuxi\SuluGlossaryBundle\Search\GlossaryEntryWebsiteReindexProvider:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_core.webspace.webspace_manager'
        tags:
            - { name: cmsig_seal.reindex_provider }

    Manuxi\SuluGlossaryBundle\Search\GlossaryEntryIndexListener:
        arguments:
            - '@sulu_message_bus'
        tags:
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\CreatedEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\ModifiedEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\RemovedEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\RestoredEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\TranslationRestoredEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\TranslationRemovedEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\CopiedLanguageEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\VersionRestoredEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\DraftRemovedEvent, method: onDraftChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\PublishedEvent, method: onLiveChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\UnpublishedEvent, method: onLiveChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\RemovedEvent, method: onLiveChanged }
            - { name: kernel.event_listener, event: Manuxi\SuluGlossaryBundle\Domain\Event\TranslationRemovedEvent, method: onLiveChanged }

    Manuxi\SuluGlossaryBundle\EventSubscriber\GlossaryEntryCacheInvalidationSubscriber:
        arguments:
            - '@?sulu_http_cache.cache_manager'
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_content.content_aggregator'
        tags:
            - { name: kernel.event_subscriber }

    Manuxi\SuluGlossaryBundle\Reference\GlossaryEntryReferenceRefresher:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_reference.reference_repository'
            - '@sulu_content.content_view_resolver'
            - '@sulu_content.content_merger'
        tags:
            - { name: sulu_reference.refresher }

    Manuxi\SuluGlossaryBundle\Versioning\VersionPruner:
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '%sulu_glossary.versioning.max_versions%'
        tags:
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.publish, method: onPublish }

    Manuxi\SuluGlossaryBundle\Twig\GlossaryTwigExtension:
        arguments:
            - '@Manuxi\SuluGlossaryBundle\Repository\GlossaryEntryRepositoryInterface'
            - '@sulu_content.content_aggregator'
            - '@sulu_content.content_manager'
            - '@request_stack'
            - '%sulu_glossary.twig.auto_abbr%'
            - '@?sulu_http_cache.reference_store'
        tags:
            - { name: twig.extension }

    Manuxi\SuluGlossaryBundle\Twig\GlossarySettingsTwigExtension:
        arguments:
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: twig.extension }
