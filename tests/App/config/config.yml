framework:
    profiler: { enabled: true, collect: false }

doctrine:
    orm:
        mappings:
            gedmo_tree:
                type: xml
                prefix: Gedmo\Tree\Entity
                dir: "%gedmo_directory%/Tree/Entity"
                alias: GedmoTree
                is_bundle: false

sulu_glossary:
    versioning:
        max_versions: 2
    twig:
        auto_abbr: true
